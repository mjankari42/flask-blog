<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if title %}
    <title>{{ title }} - Blog</title>
    {% else %}
    <title>Welcome to Blog!</title>
    {% endif %}
</head>
<body>
    <h1>Hello, {{ user.username }}</h1>
    {% for post in posts %}
    <p>{{ post.author.username }} says: {{ post.body }}</p>
    {% endfor %}
</body>
</html>
